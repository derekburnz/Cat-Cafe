# Cat Cafe CI: the same done gate agents run locally (rule 6 in CLAUDE.md), plus the Studio-free unit tests.
# PR runs check the PR merged with main (.github/scripts/merge-main.sh). The gate and cloudcheck jobs are the
# required checks of main's ruleset (docs/setup-guide.md step 18), so GitHub's auto-merge merges a PR once both
# pass. The last job is the older merger, for PRs labeled `automerge` (.github/scripts/automerge.sh);
# workflow_dispatch is how that script starts a run on a PR branch with a newer main merged in. Nothing is pushed
# to the branch.
name: check

on:
  push:
    branches: [main]
  pull_request:
    # GitHub's three defaults, plus auto_merge_enabled: turning auto-merge on checks the PR again against the
    # main of that moment, and GitHub waits for that run before it merges.
    types: [opened, synchronize, reopened, auto_merge_enabled]
  workflow_dispatch:
    inputs:
      main:
        description: "Main commit to merge into the branch before checking (automerge.sh sets it; empty means the latest main)"
        type: string
        required: false

# A new push to a PR cancels that PR's older run, so only the latest head is checked (and nobody gets mail about
# a run nobody needs). Runs on main and dispatched runs each get their own group and are never cancelled.
# Turning auto-merge on cancels nothing: it used to cancel the run already checking the same head and start it
# again (50 of 60 cancelled runs on 2026-11-11). Its run now waits for that one, then finds the tree already
# passed (the "Already passed?" steps) and ends in about a minute, or checks in full when main moved in between
# or the first run failed.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'auto_merge_enabled' }}

jobs:
  gate:
    name: Rojo sourcemap, luau-lsp, Selene, StyLua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main: ${{ steps.main.outputs.main }}
      tree: ${{ steps.main.outputs.tree }}
      passed: ${{ steps.passed.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Merge main in (not pushed)
        id: main
        run: bash .github/scripts/merge-main.sh "${{ inputs.main }}"

      # The tree (the PR merged with main) is the whole input of every check here, so a tree that passed before
      # passes again. The mark is only written by the last job of a run where gate and cloudcheck both passed,
      # so it can never hide a red run. It is kept per PR by GitHub's cache rules.
      - name: Already passed? (this same tree was checked green before)
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .check-passed
          key: check-passed-${{ steps.main.outputs.tree }}
          lookup-only: true

      # Both the installer and `rokit install` look releases up through the GitHub API. Unauthenticated, that is 60
      # calls an hour per runner IP, which a burst of runs used up on 2026-10-27 (HTTP 403 in this step); with the
      # job's own token the limit is per repo and far higher. GITHUB_PAT is the name the installer reads.
      - name: Install Rokit
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" authenticate github --token "$GITHUB_PAT" --skip-verify

      - name: Install the pinned toolchain (rokit.toml)
        if: steps.passed.outputs.cache-hit != 'true'
        run: rokit install --no-trust-check

      - name: Run the check gate
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: games/cat-cafe
        run: bash ./check.sh

  # The unit tests and the UI gate used to run one after the other in the cloudcheck job (23 minutes on
  # 2026-11-07: about 8 of tests, most of it Pace.spec, and 14 of UI gate). Now the tests run in one job, their spec
  # batches side by side, while the UI gate's scenes are split over UI_SHARDS runners, and cloudcheck only merges
  # the shards and checks them as one full run (#2304). cloudcheck keeps its name, so main's ruleset and auto-merge
  # see the same required check, and it fails when any part failed or was skipped.
  units:
    name: Unit tests and strict type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: games/cat-cafe/tools/cloudcheck
    outputs:
      main: ${{ steps.main.outputs.main }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Merge main in (not pushed)
        id: main
        working-directory: .
        run: bash .github/scripts/merge-main.sh "${{ inputs.main }}"

      - name: Already passed? (see the gate job)
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .check-passed
          key: check-passed-${{ steps.main.outputs.tree }}
          lookup-only: true

      - uses: actions/setup-node@v5
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games/cat-cafe/tools/cloudcheck/package-lock.json

      - run: npm ci
        if: steps.passed.outputs.cache-hit != 'true'

      - name: Strict type check
        if: steps.passed.outputs.cache-hit != 'true'
        run: node analyze.mjs --tests

      - name: Unit tests (spec batches side by side)
        if: steps.passed.outputs.cache-hit != 'true'
        run: node run-tests.mjs

  uigate:
    name: UI gate scenes ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4] # UI_SHARDS: change the 4 in the name and the --shard below with it
    defaults:
      run:
        working-directory: games/cat-cafe/tools/cloudcheck
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Merge main in (not pushed)
        id: main
        working-directory: .
        run: bash .github/scripts/merge-main.sh "${{ inputs.main }}"

      - name: Already passed? (see the gate job)
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .check-passed
          key: check-passed-${{ steps.main.outputs.tree }}
          lookup-only: true

      - uses: actions/setup-node@v5
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games/cat-cafe/tools/cloudcheck/package-lock.json

      - run: npm ci
        if: steps.passed.outputs.cache-hit != 'true'

      - name: Build this shard's scenes at every size (checked in cloudcheck)
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          node uigate.mjs --shard ${{ matrix.shard }}/4 --save "$RUNNER_TEMP/uigate-shard"
          echo "${{ steps.main.outputs.main }}" > "$RUNNER_TEMP/uigate-shard/main-${{ matrix.shard }}.txt"

      - uses: actions/upload-artifact@v4
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          name: uigate-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/uigate-shard
          retention-days: 1
          if-no-files-found: error

  cloudcheck:
    name: Luau unit tests and strict type check (WebAssembly Luau)
    needs: [units, uigate]
    # A required check that is skipped counts as passed, so this job runs even when a need failed and fails itself
    # then. Not when the run was cancelled (a newer push or auto-merge run replaced it): it ends cancelled, which
    # never counts as passed, instead of posting a failure for a run nobody needs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/cat-cafe/tools/cloudcheck
    outputs:
      main: ${{ steps.main.outputs.main }}
    steps:
      - name: Tests and every UI gate shard passed
        working-directory: .
        run: |
          echo "unit tests: ${{ needs.units.result }}, UI gate shards: ${{ needs.uigate.result }}"
          [ "${{ needs.units.result }}" = success ] && [ "${{ needs.uigate.result }}" = success ]

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      # The same main the unit tests checked against, so every part saw one tree.
      - name: Merge main in (not pushed)
        id: main
        working-directory: .
        run: bash .github/scripts/merge-main.sh "${{ needs.units.outputs.main }}"

      - name: Already passed? (see the gate job)
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .check-passed
          key: check-passed-${{ steps.main.outputs.tree }}
          lookup-only: true

      - uses: actions/setup-node@v5
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games/cat-cafe/tools/cloudcheck/package-lock.json

      - run: npm ci
        if: steps.passed.outputs.cache-hit != 'true'

      - uses: actions/download-artifact@v4
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          pattern: uigate-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/uigate-shards

      - name: UI gate (every shard checked as one run)
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          MAIN: ${{ steps.main.outputs.main }}
        run: |
          dir="$RUNNER_TEMP/uigate-shards"
          for f in "$dir"/main-*.txt; do
            if [ "$(cat "$f")" != "$MAIN" ]; then
              echo "::error::UI gate shard $(basename "$f") checked main $(cat "$f"), not $MAIN. Re-run the check."
              exit 1
            fi
          done
          node uigate.mjs --merge "$dir"

  # Marks the tree as passed, for the "Already passed?" steps. Only after gate and cloudcheck both passed in this
  # run (needs without an `if` means every need succeeded), and only once per tree.
  passed:
    name: Mark this tree as passed
    needs: [gate, cloudcheck]
    if: ${{ needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "${{ needs.gate.outputs.tree }} passed in run ${{ github.run_id }}" > .check-passed
      - uses: actions/cache/save@v4
        with:
          path: .check-passed
          key: check-passed-${{ needs.gate.outputs.tree }}

  automerge:
    # Starts only when gate and cloudcheck passed in this run, which is what the script relies on: it merges on this
    # run's result and never reads the checks API (that lagged finished jobs by minutes on 2026-10-27). It also
    # needs the main commit both jobs checked against.
    name: Merge if labeled automerge
    needs: [gate, cloudcheck]
    # PR runs only when the label was on at push time (a label added later is automerge.yml's), and runs that
    # the script dispatched on a PR branch. Never on main.
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge')) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/automerge.sh "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          CHECKED_MAIN: ${{ needs.gate.outputs.main }}
          CHECKED_MAIN_UNITS: ${{ needs.cloudcheck.outputs.main }}
