# List, make and change the game's developer products (Open Cloud Developer Products API), so nobody types them into
# Creator Hub. The same pattern as game-passes.yml. Start it from the Actions tab (dev-products > Run workflow) or
# from any thread with the GitHub actions_run_trigger tool on main. list prints every product with its id; create
# makes each product in games/cat-cafe/tools/opencloud/products.json that is missing, always off sale, and prints the
# Config lines for its ids; set changes one product's price, sale state, regional pricing or
# icon; set with batch changes many products in one run. Products cannot be deleted, so a product is named and
# described as final before it goes in products.json,
# and it stays off sale until the code that grants it (ProductService, Catalog.products) is merged.
# Needs the repo secret ROBLOX_PUBLISH_KEY with developer-product:read and developer-product:write.
name: dev-products

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list: every product and its id. create: make the missing products from products.json. set: change one product"
        type: choice
        options: [list, create, set]
        default: list
      product:
        description: "set: the product id, or its name"
        required: false
        default: ""
      changes:
        description: "set: one or more of price=N forSale=true|false regional=true|false icon=<image path from the repo root>"
        required: false
        default: ""
      batch:
        description: "set, many products in one run (instead of product and changes): entries separated by ; each as name-or-id|changes"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dev-products
  cancel-in-progress: false

jobs:
  products:
    name: Developer products
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_PUBLISH_KEY }}
      ROBLOX_UNIVERSE_ID: "10773193456" # Cat Cafe
      ACTION: ${{ inputs.action }}
      PRODUCT: ${{ inputs.product }}
      CHANGES: ${{ inputs.changes }}
      BATCH: ${{ inputs.batch }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the key is set
        run: |
          if [ -z "$ROBLOX_PUBLISH_KEY" ]; then
            echo "::error::The repo secret ROBLOX_PUBLISH_KEY is missing. Steps: docs/setup-guide.md step 15."
            exit 1
          fi

      # The inputs reach the script as environment variables, never pasted into the shell, so no input runs as code.
      - name: Developer products
        run: |
          script=games/cat-cafe/tools/opencloud/dev-products.sh
          case "$ACTION" in
          list | create) bash "$script" "$ACTION" ;;
          set)
            if [ -n "$BATCH" ]; then
              IFS=';' read -r -a items <<<"$BATCH"
              failed=0
              for item in "${items[@]}"; do
                target=${item%%|*}
                read -r -a changes <<<"${item#*|}"
                bash "$script" set "$target" "${changes[@]}" || failed=$((failed + 1))
                sleep 1
              done
              if [ "$failed" -gt 0 ]; then
                echo "::error::$failed change(s) failed; see the log above"
                exit 1
              fi
            else
              read -r -a changes <<<"$CHANGES"
              bash "$script" set "$PRODUCT" "${changes[@]}"
            fi
            ;;
          *)
            echo "::error::unknown action: $ACTION"
            exit 1
            ;;
          esac
