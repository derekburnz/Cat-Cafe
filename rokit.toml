# Rokit pins the toolchain so everyone runs identical versions.
# Install Rokit once (docs/setup-guide.md step 4), then run `rokit install` in this folder.
# Bump a tool with `rokit add <owner>/<repo>@<version>` or check for updates with `rokit update`.
# Versions below were current as of late 2025; run `rokit update` on first setup and commit the result.

[tools]
rojo = "rojo-rbx/rojo@7.5.1"
wally = "UpliftGames/wally@0.3.2"
wally-package-types = "JohnnyMorganz/wally-package-types@1.4.2"
selene = "Kampfkarren/selene@0.28.0"
stylua = "JohnnyMorganz/StyLua@2.1.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.48.0"
