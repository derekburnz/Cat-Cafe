  <path d="M110 104 q12 12 0 24 M134 98 q12 15 0 30 M158 104 q12 12 0 24 M122 136 q12 12 0 24 M146 136 q12 12 0 24" fill="none" stroke="#D98A10" stroke-width="7" stroke-linecap="round"/>
