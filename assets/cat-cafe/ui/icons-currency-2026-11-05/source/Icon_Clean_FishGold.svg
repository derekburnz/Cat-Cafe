<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0A0"/><stop offset="0.5" stop-color="#FFC92E"/><stop offset="1" stop-color="#E0880E"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB323"/><stop offset="1" stop-color="#D2700A"/>
    </linearGradient>
  </defs>
  <!-- tail -->
  <path d="M176 128 L240 70 Q226 128 240 186 Z" fill="url(#fin)" stroke="#2a1a12" stroke-width="14" stroke-linejoin="round"/>
