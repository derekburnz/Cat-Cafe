# Read the friends' in-game bug reports from Roblox (Open Cloud data stores), so threads see them without Studio.
# Start it from the Actions tab (bug-reports > Run workflow) or from any thread with the GitHub actions_run_trigger
# tool; the job log and the run summary list the reports. It also runs by itself every morning at 10:17 UTC for
# yesterday's reports and today's so far. Read only. Needs the repo secret ROBLOX_PUBLISH_KEY with
# the data store List and Read permissions (docs/setup-guide.md step 17).
name: bug-reports

on:
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day as YYYYMMDD (empty: today)"
        required: false
        default: ""
      count:
        description: "Newest this many reports of that day"
        required: false
        default: "50"
      studio:
        description: "Studio playtests' reports instead of the players'"
        type: boolean
        default: false
  # Every morning before Derek is on, with analytics.yml: yesterday's reports and today's so far, for the
  # fixing-phase read (QA-Planner, fixing-phase plan section 4).
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

env:
  UNIVERSE_ID: "10773193456" # the Cat Cafe experience

jobs:
  read:
    name: List the bug reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_PUBLISH_KEY }}
      DAY: ${{ inputs.day }}
      COUNT: ${{ inputs.count }}
      STUDIO: ${{ inputs.studio && 'studio' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: games/cat-cafe/tools/opencloud

      - name: Check the key is set
        run: |
          if [ -z "$ROBLOX_PUBLISH_KEY" ]; then
            echo "::error::The repo secret ROBLOX_PUBLISH_KEY is missing. Steps: docs/setup-guide.md step 15."
            exit 1
          fi

      - name: Read the reports
        if: github.event_name != 'schedule'
        run: bash games/cat-cafe/tools/opencloud/bug-reports.sh "$DAY" "$COUNT" $STUDIO

      - name: Read yesterday's reports (daily run)
        if: github.event_name == 'schedule'
        run: bash games/cat-cafe/tools/opencloud/bug-reports.sh "$(date -u -d yesterday +%Y%m%d)" 100

      - name: Read today's reports so far (daily run)
        if: github.event_name == 'schedule'
        run: bash games/cat-cafe/tools/opencloud/bug-reports.sh "" 100
