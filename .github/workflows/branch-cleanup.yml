# Deletes finished branches: every branch whose pull request was merged, plus every branch whose tip is already in
# main (if its last commit is over 2 days old). Branches with an open pull request, main itself, fresh branches and
# branches that never had a merged pull request are kept.
# Run from the Actions tab (branch-cleanup > Run workflow) or the GitHub actions_run_trigger tool. dry_run (default
# true) only lists what would go; set it to false to delete. A deleted branch can be restored from its pull request
# page ("Restore branch") or from refs/pull/<n>/head. Added 2026-11-04 at Derek's ask (friend's project).
name: branch-cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only, delete nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete finished branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Work out and delete finished branches
        run: |
          set -euo pipefail
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref' | sort -u > open.txt
          # "ref sha" for each merged PR. A branch counts as finished only when its tip is still that PR's head, so
          # a branch restarted from main with new commits after its PR merged is kept.
          gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == env.REPO) | "\(.head.ref) \(.head.sha)"' \
            | sort -u > merged_pr_heads.txt
          git for-each-ref --format='%(refname:lstrip=3) %(objectname)' refs/remotes/origin | sort -u > tips.txt
          comm -12 merged_pr_heads.txt tips.txt | cut -d' ' -f1 | sort -u > merged_pr.txt
          # Branches already in main by ancestry, but only when their last commit is over 2 days old: a branch
          # just made from main (no commits of its own yet, like a new claude/* session branch) is kept.
          cutoff=$(date -u -d '2 days ago' +%s)
          git for-each-ref --merged origin/main --format='%(refname:lstrip=3) %(committerdate:unix)' refs/remotes/origin \
            | awk -v c="$cutoff" '$2 < c {print $1}' | grep -v -x -e HEAD -e main -e origin | sort -u > in_main.txt
          git branch -r --format='%(refname:short)' | sed 's#^origin/##' | grep -v -x -e HEAD -e main -e origin | sort -u > all.txt
          sort -u merged_pr.txt in_main.txt | comm -12 - all.txt | comm -23 - open.txt > delete.txt
          comm -23 all.txt delete.txt > keep.txt
          echo "Branches: $(wc -l < all.txt). To delete: $(wc -l < delete.txt). Kept: $(wc -l < keep.txt) (open PRs: $(wc -l < open.txt))."
          echo "== kept (not open, never merged):"
          comm -23 keep.txt open.txt || true
          {
            echo "### branch-cleanup"
            echo "Branches $(wc -l < all.txt), delete $(wc -l < delete.txt), keep $(wc -l < keep.txt). Dry run: $DRY_RUN."
            echo
            echo "Kept, not open and never merged:"
            comm -23 keep.txt open.txt | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing deleted."
            exit 0
          fi
          n=0
          while read -r b; do
            [ -n "$b" ] || continue
            enc=$(printf '%s' "$b" | jq -sRr @uri)
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$enc" --silent; then n=$((n + 1)); else echo "could not delete $b"; fi
          done < delete.txt
          echo "Deleted $n branches."
          echo "Deleted $n branches." >> "$GITHUB_STEP_SUMMARY"
