<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="sans-serif" font-size="12">
  <title>Mystery Market corner, top-down plan (look A, the wagon)</title>
  <rect width="560" height="420" fill="#f4efe6"/>
  <!-- hedges closing the west arch -->
  <rect x="20" y="40" width="30" height="340" fill="#6b8f5a"/>
  <text x="24" y="30" fill="#333">Hedge (closed west arch, x -63)</text>
  <!-- rug -->
  <circle cx="200" cy="210" r="110" fill="#c9a26b" opacity="0.5"/>
  <!-- wagon -->
  <rect x="80" y="150" width="120" height="120" rx="20" fill="#2f6f73"/>
  <text x="96" y="214" fill="#fff">Wagon (12 x 7)</text>
  <!-- counter and pedestal -->
  <rect x="200" y="170" width="24" height="80" fill="#8a5a3b"/>
  <circle cx="250" cy="210" r="16" fill="#e8c35a"/>
  <text x="270" y="206" fill="#333">Pedestal: featured item turns</text>
  <!-- Moss -->
  <circle cx="225" cy="140" r="10" fill="#7a5c8c"/>
  <text x="240" y="138" fill="#333">Moss on the step, lantern above</text>
  <!-- boards -->
  <rect x="230" y="280" width="34" height="18" fill="#333"/>
  <text x="270" y="293" fill="#333">"This week: SALE" board</text>
  <rect x="230" y="310" width="22" height="14" fill="#555"/>
  <text x="258" y="322" fill="#333">"?" next-week board</text>
  <!-- crates -->
  <rect x="90" y="290" width="26" height="26" fill="#a87b4f"/>
  <rect x="120" y="296" width="20" height="20" fill="#a87b4f"/>
  <rect x="96" y="100" width="22" height="22" fill="#a87b4f"/>
  <!-- lanterns -->
  <line x1="200" y1="160" x2="320" y2="90" stroke="#333" stroke-dasharray="4 4"/>
  <line x1="200" y1="260" x2="320" y2="330" stroke="#333" stroke-dasharray="4 4"/>
  <circle cx="320" cy="90" r="6" fill="#f2b84b"/><circle cx="320" cy="330" r="6" fill="#f2b84b"/>
  <text x="330" y="94" fill="#333">Lantern post</text>
  <!-- lane -->
  <rect x="340" y="180" width="200" height="60" fill="#d8d2c4"/>
  <text x="380" y="214" fill="#333">East-west lane (z -6 to 6)</text>
  <text x="420" y="260" fill="#333">to the cannon (0, 0)</text>
  <path d="M520 255 l14 0 l-6 -6 m6 6 l-6 6" stroke="#333" fill="none"/>
  <text x="60" y="405" fill="#333">About 22 studs across (z -11 to 11) x 14 deep (x -63 to -49). Faces east. Not to scale.</text>
</svg>
